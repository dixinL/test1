name: 每日行业报告

on:
  push:
    branches: [main]
  schedule:
    # 北京时间每天早上5点 = UTC 21:00（前一天）
    - cron: "0 21 * * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      # 统一 pyc 缓存位置，避免 __pycache__ 混入提交
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.pycache
      # CI 非 tty 下 Python 子进程 stdout 块缓冲会导致日志长时间不刷新，强制实时输出
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 daily（刷新→趋势→日报→整合→RSS→推送）
        working-directory: analysis-hub
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          python run.py daily --notify

      - name: 提交生成的文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 获取当日日期
          TODAY=$(date +%Y-%m-%d)

          git add analysis-hub/report/ sw2-daily-report/report/ \
                  sw2-trend-analysis/data/exports/ 2>/dev/null || true

          # 仅在有变更时提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 每日报告 ${TODAY}"
            git push
          fi
